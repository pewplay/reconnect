<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Reconnect</title>
  <meta name="description" content="Help your computer get back online: steer it and a mirrored Wi-Fi signal together past firewalls and Ice Walkers.">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="stage">
    <canvas id="game" aria-label="Reconnect game board"></canvas>
    <div id="pad" hidden>
      <button type="button" class="pad-btn" data-dir="up" aria-label="Up">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5 4 16h16z"/></svg>
      </button>
      <button type="button" class="pad-btn" data-dir="left" aria-label="Left">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12 16 4v16z"/></svg>
      </button>
      <button type="button" class="pad-btn pad-ok" data-action="ok" aria-label="Continue">OK</button>
      <button type="button" class="pad-btn" data-dir="right" aria-label="Right">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12 8 4v16z"/></svg>
      </button>
      <button type="button" class="pad-btn" data-dir="down" aria-label="Down">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19 4 8h16z"/></svg>
      </button>
      <button type="button" class="pad-btn pad-restart" data-action="restart" aria-label="Restart this day">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4a8 8 0 1 0 8 8h-3a5 5 0 1 1-5-5v3l5-4.5L12 1z"/></svg>
      </button>
    </div>
  </main>
  <script src="logic.js"></script>
  <script src="game.js"></script>
</body>
</html>
